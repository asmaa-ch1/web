<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Page</title>

  <!-- CSS: the style -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      color: #1c2230;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #3556c9;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      border-radius: 8px;
      padding: 10px;
      margin: 8px auto;
      max-width: 300px;
    }
    button {
      background: #3556c9;
      color: white;
      border: 0;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Hello, Lebanon!</h1>
  <p>I am learning web development.</p>

  <h2>What I will learn</h2>
  <ul>
    <li>HTML: the structure</li>
    <li>CSS: the style</li>
    <li>JavaScript: the behavior</li>
  </ul>

  <button onclick="sayHi()">Click me</button>
  <p id="message"></p>

  <!-- JavaScript: the behavior -->
  <script>
    let clicks = 0;

    function sayHi() {
      clicks = clicks + 1;
      document.getElementById("message").textContent =
        "You clicked " + clicks + " time(s)!";
    }
  </script>

</body>
</html>
