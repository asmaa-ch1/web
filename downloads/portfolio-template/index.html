<!DOCTYPE html>
<!-- PORTFOLIO TEMPLATE
     1. Find every "CHANGE ME" and replace it with your own words.
     2. Save (Ctrl+S / Cmd+S) and look at the page in Live Server.
     3. Experiment! Delete a line, add a line, and see what happens. -->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHANGE ME: My Web Profile</title>
  <!-- The text on the browser TAB. -->
</head>

<body>

  <header>
    <!-- header = the top of the page -->
    <h1>CHANGE ME: Your Name</h1>
    <!-- h1 = the main heading. Use only one per page. -->
  </header>


  <main>
    <!-- main = the main content of the page -->

    <section>
      <!-- section = one topic of the page -->
      <h2>About me</h2>
      <!-- h2 = a heading for this section. Try changing it to h3 and see the size change. -->

      <p>CHANGE ME: write 2 or 3 sentences about yourself.</p>
      <!-- p = a paragraph of text. Add another p to add another paragraph. -->

      <img src="photo.jpg" alt="CHANGE ME: describe your photo">
      <!-- img = a picture.
           src: put a file named photo.jpg in this same folder, OR paste an image link.
           alt: the description shown if the image can't load (and read by screen readers).
           No photo yet? The alt text will show instead. That is normal! -->

      <p>My favorite website:
        <a href="https://www.wikipedia.org">CHANGE ME: link text</a>
      </p>
      <!-- a = a link. href = where it goes. The text between the tags is what people click. -->
    </section>


    <section>
      <h2>My hobbies and skills</h2>

      <ul>
        <!-- ul = a bullet list. Each li is one item. -->
        <li>CHANGE ME: hobby or skill 1</li>
        <li>CHANGE ME: hobby or skill 2</li>
        <li>CHANGE ME: hobby or skill 3</li>
        <!-- Want a 4th item? Copy a whole li line and paste it here. -->
      </ul>
    </section>


    <section>
      <h2>Contact me</h2>
      <!-- LATER: we will add a form here. -->
    </section>

  </main>


  <footer>
    <!-- footer = the bottom of the page -->
    <p>CHANGE ME: your city · 2026</p>
  </footer>

</body>
</html>
