<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Development Workshop – Day 4: CSS Styling</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c2230;--mu:#5b6475;--ac:#3556c9;--soft:#e8edfb;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1d212c;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7b97f0;--soft:#232a40;--bd:#2e3442}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1d212c;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7b97f0;--soft:#232a40;--bd:#2e3442}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.sl{position:absolute;inset:0 0 44px;padding:4vh 6vw;display:none;flex-direction:column;justify-content:center;gap:2vh;overflow-y:auto}
.sl.on{display:flex}
h1{font-size:clamp(34px,6vw,72px);line-height:1.08;color:var(--tx)}
h2{font-size:clamp(24px,3.6vw,44px);line-height:1.12;padding-bottom:1.2vh;border-bottom:2px solid var(--bd)}
h3{font-size:clamp(15px,1.8vw,22px);margin:.2em 0}
p,li{font-size:clamp(13px,1.55vw,20px);line-height:1.45;color:var(--mu)}
.tag{font-size:clamp(11px,1.2vw,14px);letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.4vw}
.row{display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center}
@media (max-width:800px){.row{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1.3vw}
.c.cur{border:2px solid var(--ac)}
.ib{width:clamp(34px,3.6vw,48px);height:clamp(34px,3.6vw,48px);border-radius:10px;background:var(--soft);color:var(--ac);display:flex;align-items:center;justify-content:center;margin-bottom:.6vh}
.ic{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .ic{width:58%;height:58%}
.n{font-size:clamp(20px,2.6vw,34px);font-weight:700;color:var(--ac)}
ul{padding-left:1.2em;display:grid;gap:.5vh}
.lv{font-size:clamp(12px,1.3vw,17px);color:var(--mu);border-left:3px solid var(--ac);padding-left:1vw}.lv b{color:var(--tx)}
.fl{display:flex;align-items:stretch;gap:.8vw}.fl>.c{flex:1}.fl>.ic{width:2.4vw;min-width:22px;align-self:center;color:var(--ac)}
.q{cursor:pointer}.q .a{display:none;color:var(--ac);font-weight:600;margin-top:.6em;font-size:clamp(13px,1.5vw,19px)}.q.open .a{display:block}.q .h{font-size:12px;color:var(--mu)}
.ctr{text-align:center}.ctr .n{display:block;font-size:clamp(28px,3.6vw,46px);margin-bottom:.3vh}
.flip{perspective:1000px;height:clamp(170px,26vh,230px)}.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.open .fi{transform:rotateY(180deg)}.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center}.fb{transform:rotateY(180deg);background:var(--ac);border-color:var(--ac)}.fb h3,.fb p{color:#fff}
.fn{font-size:clamp(11px,1.15vw,14px)}
svg.fig{width:100%;height:auto;max-height:46vh;display:block}
.fig text{font-family:inherit;fill:var(--tx);font-size:13px}.fig .m{fill:var(--mu);font-size:11px}
.fig .b{fill:var(--card);stroke:var(--bd);stroke-width:1.5}.fig .s{fill:var(--soft);stroke:var(--ac);stroke-width:1.3}.fig .a{fill:var(--ac)}.fig .l{stroke:var(--ac);stroke-width:2;fill:none}.fig .g1{fill:var(--bd)}
.fig .mt{fill:#fff;font-size:11px;font-weight:700}
.tb{display:flex;gap:8px;flex-wrap:wrap}.tb button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:clamp(12px,1.4vw,18px)}.tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
pre{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:1.2vw;font-size:clamp(10px,1.2vw,15px);color:var(--tx);overflow:auto;max-height:46vh;line-height:1.4}iframe{width:100%;height:42vh;border:1px solid var(--bd);border-radius:10px;background:#fff}
.st{padding-left:1.2em;display:grid;gap:.5vh}.st li{font-size:clamp(12px,1.3vw,17px)}
.tbb{border:1px solid var(--ac);background:var(--card);color:var(--ac);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:clamp(12px,1.4vw,18px);align-self:flex-start}
.ans{color:var(--ac);font-weight:600}.cmp pre{min-height:17vh;max-height:17vh;font-size:clamp(9px,1.05vw,13px);margin-bottom:1vh}.cmp iframe{height:19vh}.vw{display:flex;flex-direction:column;gap:1.2vh}
.vt{display:flex;flex-direction:column;gap:1.2vh}.vt iframe{height:46vh}.ib{flex-shrink:0}.k1{color:var(--ac);font-weight:700}.k2{color:#0f766e}.k3{color:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k2{color:#5eead4}:root:not([data-theme="light"]) .k3{color:#fbbf24}}
:root[data-theme="dark"] .k2{color:#5eead4}:root[data-theme="dark"] .k3{color:#fbbf24}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--card);border-top:1px solid var(--bd);z-index:5}
#bar button{border:0;background:var(--ac);color:#fff;width:34px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
#bar button.s{background:transparent;color:var(--mu);width:auto;font-size:13px;padding:0 6px}
#pr{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}#pf{height:100%;width:0;background:var(--ac)}
#ct{font-size:13px;color:var(--mu);min-width:52px;text-align:center}
#nt{position:fixed;left:2vw;right:2vw;bottom:54px;background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:12px 16px;display:none;z-index:6;max-height:28vh;overflow:auto}
#nt.on{display:block}#nt p{font-size:15px;color:var(--tx)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3556c9"/></marker>
<symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
<symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.5 2.5-2.4-.6-.6-2.4z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3zM4 17a3 3 0 0 1 3-3h12"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>

<symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></symbol>

<symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></symbol>
<symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 14h.01M15 14h.01M2 13v3M22 13v3"/></symbol>
<symbol id="i-rocket" viewBox="0 0 24 24"><path d="M14 4c4 0 6 2 6 6-2 4-5 7-8 8l-4-4c1-3 4-8 6-10zM9 14l-4 4M8 19l-3 0M5 16l0 3"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a6 6 0 0 1 3 6"/></symbol>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/></symbol>
<symbol id="i-utensils" viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8M6 7h4M17 3c-2 2-3 5-3 8h3v10"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
</defs></svg>
<div id="deck"></div>
<div id="nt"><p id="ntx"></p></div>
<div id="bar"><button id="pv" aria-label="Previous">←</button><button id="nx" aria-label="Next">→</button><div id="pr"><div id="pf"></div></div><span id="ct"></span><button class="s" id="nb">Notes (N)</button><button class="s" id="fs">Fullscreen (F)</button></div>
<script>
const S=[];const s=(b,n)=>S.push({b,n:n||''});
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const ib=n=>`<div class="ib">${ic(n)}</div>`;
const cards=a=>`<div class="g">${a.map(([h,p,i])=>`<div class="c">${ib(i)}<h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`;
const lv=(b,a)=>`<div class="lv"><b>Beginner:</b> ${b} &nbsp; <b>Going further:</b> ${a}</div>`;
const T=(t,x)=>`<div class="tag">${t}</div><h2>${x}</h2>`;
const row=(l,r)=>`<div class="row"><div>${l}</div><div>${r}</div></div>`;
const fig=(v,b)=>`<svg class="fig" viewBox="${v}">${b}</svg>`;
const ico=(n,x,y,w)=>`<use href="#i-${n}" x="${x}" y="${y}" width="${w}" height="${w}" class="ic" style="fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/>`;
const mk=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="9" class="a"/><text x="${x}" y="${y+4}" text-anchor="middle" class="mt">${n}</text>`;

/* reusable figures */
const anat=fig('0 0 320 230',`<rect class="b" x="2" y="2" width="316" height="226" rx="8"/><rect class="s" x="12" y="12" width="296" height="32" rx="4"/><text x="24" y="33">Header</text><text class="m" x="250" y="33">logo · title</text><rect class="s" x="12" y="50" width="296" height="22" rx="4"/><text x="24" y="66">Navigation (nav)</text><rect class="s" x="12" y="78" width="296" height="104" rx="4"/><text x="24" y="98">Main content</text><rect class="g1" x="24" y="108" width="170" height="8" rx="3"/><rect class="g1" x="24" y="124" width="140" height="8" rx="3"/><rect class="g1" x="24" y="140" width="160" height="8" rx="3"/><rect class="b" x="212" y="104" width="86" height="64" rx="4"/><rect class="s" x="12" y="188" width="296" height="30" rx="4"/><text x="24" y="208">Footer</text><text class="m" x="212" y="208">© · contact · links</text>`);
const shop=fig('0 0 360 250',`<rect class="b" x="2" y="2" width="356" height="246" rx="8"/><rect class="g1" x="12" y="12" width="50" height="24" rx="4"/><rect class="b" x="74" y="12" width="150" height="24" rx="12"/>${ico('search',200,16,16)}<rect class="b" x="234" y="12" width="52" height="24" rx="4"/><text x="244" y="29" class="m">Login</text><rect class="b" x="294" y="12" width="52" height="24" rx="4"/>${ico('cart',308,15,18)}<rect class="s" x="12" y="44" width="334" height="20" rx="4"/><text x="22" y="58" class="m">Menu · Categories · Deals</text><rect class="b" x="12" y="72" width="334" height="62" rx="4"/>${ico('image',166,84,36)}${[0,1,2].map(i=>`<rect class="b" x="${12+i*113}" y="142" width="108" height="96" rx="4"/><rect class="g1" x="${20+i*113}" y="150" width="92" height="44" rx="3"/><rect class="g1" x="${20+i*113}" y="202" width="60" height="7" rx="3"/><rect class="s" x="${20+i*113}" y="216" width="40" height="14" rx="3"/>`).join('')}${mk(20,58,1)}${mk(190,40,2)}${mk(30,126,3)}${mk(330,200,4)}${mk(256,8,5)}${mk(338,8,6)}`);
const tri=fig('0 0 450 150',[['HTML','structure',0,0],['+ CSS','style',1,1],['+ JavaScript','behavior',2,2]].map(([a,b,k,l])=>{const x=k*150+5;return `<rect class="b" x="${x}" y="4" width="130" height="100" rx="6"/>`+(l?`<rect class="a" x="${x+8}" y="12" width="114" height="16" rx="3"/><rect class="s" x="${x+8}" y="34" width="50" height="40" rx="3"/>`:`<rect x="${x+8}" y="12" width="114" height="16" rx="3" fill="none" stroke="var(--mu)" stroke-dasharray="3 2"/><rect x="${x+8}" y="34" width="50" height="40" rx="3" fill="none" stroke="var(--mu)" stroke-dasharray="3 2"/>`)+`<rect class="g1" x="${x+66}" y="38" width="54" height="6" rx="3"/><rect class="g1" x="${x+66}" y="50" width="44" height="6" rx="3"/>`+(l==2?`<rect class="a" x="${x+66}" y="64" width="46" height="16" rx="8"/>${ico('cursor',x+100,70,18)}`:'')+`<text x="${x+65}" y="126" text-anchor="middle" style="font-weight:700">${a}</text><text class="m" x="${x+65}" y="142" text-anchor="middle">${b}</text>`}).join(''));
const jour=fig('0 0 560 190',`<rect class="s" x="10" y="30" width="140" height="100" rx="10"/>${ico('monitor',60,44,40)}<text x="80" y="112" text-anchor="middle" style="font-weight:700">Browser</text><rect class="s" x="410" y="30" width="140" height="100" rx="10"/>${ico('server',460,44,40)}<text x="480" y="112" text-anchor="middle" style="font-weight:700">Server</text><path class="l" d="M155 64H402" marker-end="url(#ah)"/><text x="278" y="55" text-anchor="middle">① Request: the URL</text><path class="l" d="M405 100H158" marker-end="url(#ah)"/><text x="278" y="124" text-anchor="middle">② Response: HTML, CSS, JS</text><text class="m" x="80" y="156" text-anchor="middle">③ Renders the page</text><text class="m" x="480" y="156" text-anchor="middle">Stores the files</text>`);
const range=fig('0 0 560 150',`<line x1="30" y1="70" x2="530" y2="70" stroke="var(--bd)" stroke-width="8" stroke-linecap="round"/><line x1="64" y1="70" x2="500" y2="70" stroke="var(--ac)" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/><circle cx="64" cy="70" r="7" class="a"/><circle cx="223" cy="70" r="11" class="a"/><circle cx="500" cy="70" r="7" class="a"/><text x="64" y="104" text-anchor="middle" style="font-weight:700">&lt; $49K</text><text class="m" x="64" y="120" text-anchor="middle">lowest 10%</text><text x="223" y="40" text-anchor="middle" style="font-weight:700">~$91K</text><text class="m" x="223" y="104" text-anchor="middle">median</text><text x="500" y="104" text-anchor="middle" style="font-weight:700">&gt; $163K</text><text class="m" x="500" y="120" text-anchor="middle">top 10%</text>`);
const insp=fig('0 0 380 230',`<rect class="b" x="2" y="2" width="376" height="226" rx="8"/><path d="M2 30h376" stroke="var(--bd)"/><circle cx="16" cy="16" r="4" class="g1"/><circle cx="30" cy="16" r="4" class="g1"/><circle cx="44" cy="16" r="4" class="g1"/><rect class="g1" x="64" y="9" width="180" height="14" rx="7"/><rect class="s" x="12" y="40" width="170" height="26" rx="3"/><rect class="g1" x="12" y="72" width="170" height="14" rx="3"/><rect class="b" x="12" y="92" width="170" height="90" rx="3"/><rect class="s" x="12" y="188" width="170" height="30" rx="3"/><path d="M192 30v198" stroke="var(--bd)"/><text class="m" x="202" y="50">Elements · Styles</text><text x="202" y="76" style="font-family:monospace;font-size:12px">&lt;body&gt;</text><text x="212" y="96" style="font-family:monospace;font-size:12px;font-weight:700">&lt;header&gt;</text><rect x="206" y="82" width="104" height="18" rx="3" fill="var(--ac)" fill-opacity=".18"/><text x="212" y="116" style="font-family:monospace;font-size:12px">&lt;nav&gt;</text><text x="212" y="136" style="font-family:monospace;font-size:12px">&lt;main&gt;</text><text x="212" y="156" style="font-family:monospace;font-size:12px">&lt;footer&gt;</text><text class="m" x="202" y="186" style="font-family:monospace">header { color: …; }</text>`);

conn:[
['By tag name','p {\n  color: #3556c9;\n}','<p>First paragraph</p>\n<p>Second paragraph</p>\n<h2>A heading (not a p)</h2>','How they connect: the CSS selector p is simply the tag name. It matches EVERY p tag in the HTML, so both paragraphs turn blue. The h2 is a different tag, so it is not affected.'],
['By class','.title {\n  color: crimson;\n}','<h1 class="title">Welcome</h1>\n<p>A normal paragraph</p>\n<p class="title">This paragraph has the class too</p>','How they connect: in the HTML you add class="title" to an element (you choose the name). In the CSS you write a dot and the same name: .title. Every element with class="title" gets the style, whatever its tag. The names must match exactly.'],
['By id','#intro {\n  font-size: 24px;\n  color: #3556c9;\n}','<p id="intro">I have the id.</p>\n<p>I do not.</p>','How they connect: in the HTML you add id="intro" to ONE element. In the CSS you write a hash and the same name: #intro. Only that element is styled. An id must be used only once per page.']],
sel:[
['More than one h1','h1 {\n  color: #3556c9;\n}','<h1>First heading</h1>\n<h1>Second heading</h1>\n<h1>Third heading</h1>\n<p>A paragraph is not an h1.</p>','All three headings turn blue because the rule h1 means “every h1 on the page”, and all three are h1 tags. The paragraph is a p, not an h1, so it stays black. (Best practice: use only one h1 per page and h2 for other headings.)'],
['Style only one: class','.special {\n  color: crimson;\n}','<h1>Normal heading</h1>\n<h1 class="special">Special heading</h1>\n<h1>Normal heading</h1>','To style only one of the h1s, give that one a class in the HTML (class="special"). In the CSS, .special (with a dot) finds only the elements that have that class.'],
['Same class on many','.highlight {\n  background-color: #fff3a3;\n}','<p>Normal text</p>\n<p class="highlight">Highlighted text</p>\n<h2 class="highlight">Highlighted heading</h2>','Many elements, even with different tags, can share one class. Change the CSS rule once and all of them change.'],
['id: only one','#intro {\n  font-size: 24px;\n  color: #3556c9;\n}','<p id="intro">Only one element has this id.</p>\n<p>Another paragraph.</p>','An id is a unique name: use it on ONE element only. In HTML write id="intro", in CSS write #intro (with a hash).'],
['Group: h1, h2','h1, h2 {\n  color: #3556c9;\n}','<h1>Heading 1</h1>\n<h2>Heading 2</h2>\n<p>This paragraph is not styled.</p>','A comma lets one rule style several selectors at once, so you do not repeat yourself.'],
['Which rule wins?','h1 {\n  color: blue;\n}\nh1 {\n  color: red;\n}','<h1>Which color am I?</h1>','When two rules clash, the one written LATER wins. This is the “cascading” in Cascading Style Sheets.'],
['Class beats tag','.special {\n  color: crimson;\n}\nh1 {\n  color: blue;\n}','<h1 class="special">Crimson or blue?</h1>','h1 comes later, but the class wins because a more specific selector beats a general one: id beats class, and class beats tag.']],
