<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Development Workshop – Day 2: Design Thinking</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c2230;--mu:#5b6475;--ac:#3556c9;--soft:#e8edfb;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1d212c;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7b97f0;--soft:#232a40;--bd:#2e3442}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1d212c;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7b97f0;--soft:#232a40;--bd:#2e3442}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.sl{position:absolute;inset:0 0 44px;padding:4vh 6vw;display:none;flex-direction:column;justify-content:center;gap:2vh;overflow-y:auto}
.sl.on{display:flex}
h1{font-size:clamp(34px,6vw,72px);line-height:1.08;color:var(--tx)}
h2{font-size:clamp(24px,3.6vw,44px);line-height:1.12;padding-bottom:1.2vh;border-bottom:2px solid var(--bd)}
h3{font-size:clamp(15px,1.8vw,22px);margin:.2em 0}
p,li{font-size:clamp(13px,1.55vw,20px);line-height:1.45;color:var(--mu)}
.tag{font-size:clamp(11px,1.2vw,14px);letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.4vw}
.row{display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center}
@media (max-width:800px){.row{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1.3vw}
.c.cur{border:2px solid var(--ac)}
.ib{width:clamp(34px,3.6vw,48px);height:clamp(34px,3.6vw,48px);border-radius:10px;background:var(--soft);color:var(--ac);display:flex;align-items:center;justify-content:center;margin-bottom:.6vh}
.ic{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .ic{width:58%;height:58%}
.n{font-size:clamp(20px,2.6vw,34px);font-weight:700;color:var(--ac)}
ul{padding-left:1.2em;display:grid;gap:.5vh}
.lv{font-size:clamp(12px,1.3vw,17px);color:var(--mu);border-left:3px solid var(--ac);padding-left:1vw}.lv b{color:var(--tx)}
.fl{display:flex;align-items:stretch;gap:.8vw}.fl>.c{flex:1}.fl>.ic{width:2.4vw;min-width:22px;align-self:center;color:var(--ac)}
.q{cursor:pointer}.q .a{display:none;color:var(--ac);font-weight:600;margin-top:.6em;font-size:clamp(13px,1.5vw,19px)}.q.open .a{display:block}.q .h{font-size:12px;color:var(--mu)}
.ctr{text-align:center}.ctr .n{display:block;font-size:clamp(28px,3.6vw,46px);margin-bottom:.3vh}
.flip{perspective:1000px;height:clamp(170px,26vh,230px)}.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.open .fi{transform:rotateY(180deg)}.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center}.fb{transform:rotateY(180deg);background:var(--ac);border-color:var(--ac)}.fb h3,.fb p{color:#fff}
.fn{font-size:clamp(11px,1.15vw,14px)}
svg.fig{width:100%;height:auto;max-height:46vh;display:block}
.fig text{font-family:inherit;fill:var(--tx);font-size:13px}.fig .m{fill:var(--mu);font-size:11px}
.fig .b{fill:var(--card);stroke:var(--bd);stroke-width:1.5}.fig .s{fill:var(--soft);stroke:var(--ac);stroke-width:1.3}.fig .a{fill:var(--ac)}.fig .l{stroke:var(--ac);stroke-width:2;fill:none}.fig .g1{fill:var(--bd)}
.fig .mt{fill:#fff;font-size:11px;font-weight:700}
.tb{display:flex;gap:8px;flex-wrap:wrap}.tb button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:clamp(12px,1.4vw,18px)}.tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
pre{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:1.2vw;font-size:clamp(10px,1.2vw,15px);color:var(--tx);overflow:auto;max-height:46vh;line-height:1.4}iframe{width:100%;height:42vh;border:1px solid var(--bd);border-radius:10px;background:#fff}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--card);border-top:1px solid var(--bd);z-index:5}
#bar button{border:0;background:var(--ac);color:#fff;width:34px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
#bar button.s{background:transparent;color:var(--mu);width:auto;font-size:13px;padding:0 6px}
#pr{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}#pf{height:100%;width:0;background:var(--ac)}
#ct{font-size:13px;color:var(--mu);min-width:52px;text-align:center}
#nt{position:fixed;left:2vw;right:2vw;bottom:54px;background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:12px 16px;display:none;z-index:6;max-height:28vh;overflow:auto}
#nt.on{display:block}#nt p{font-size:15px;color:var(--tx)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3556c9"/></marker>
<symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>

<symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></symbol>

<symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></symbol>
<symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 14h.01M15 14h.01M2 13v3M22 13v3"/></symbol>
<symbol id="i-rocket" viewBox="0 0 24 24"><path d="M14 4c4 0 6 2 6 6-2 4-5 7-8 8l-4-4c1-3 4-8 6-10zM9 14l-4 4M8 19l-3 0M5 16l0 3"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a6 6 0 0 1 3 6"/></symbol>

<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>

<div id="deck"></div>
<div id="nt"><p id="ntx"></p></div>
<div id="bar"><button id="pv" aria-label="Previous">←</button><button id="nx" aria-label="Next">→</button><div id="pr"><div id="pf"></div></div><span id="ct"></span><button class="s" id="nb">Notes (N)</button><button class="s" id="fs">Fullscreen (F)</button></div>
<script>
const S=[];const s=(b,n)=>S.push({b,n:n||''});
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const ib=n=>`<div class="ib">${ic(n)}</div>`;
const cards=a=>`<div class="g">${a.map(([h,p,i])=>`<div class="c">${ib(i)}<h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`;
const lv=(b,a)=>`<div class="lv"><b>Beginner:</b> ${b} &nbsp; <b>Going further:</b> ${a}</div>`;
const T=(t,x)=>`<div class="tag">${t}</div><h2>${x}</h2>`;
const row=(l,r)=>`<div class="row"><div>${l}</div><div>${r}</div></div>`;
const fig=(v,b)=>`<svg class="fig" viewBox="${v}">${b}</svg>`;
const ico=(n,x,y,w)=>`<use href="#i-${n}" x="${x}" y="${y}" width="${w}" height="${w}" class="ic" style="fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/>`;
const mk=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="9" class="a"/><text x="${x}" y="${y+4}" text-anchor="middle" class="mt">${n}</text>`;

/* reusable figures */
const anat=fig('0 0 320 230',`<rect class="b" x="2" y="2" width="316" height="226" rx="8"/><rect class="s" x="12" y="12" width="296" height="32" rx="4"/><text x="24" y="33">Header</text><text class="m" x="250" y="33">logo · title</text><rect class="s" x="12" y="50" width="296" height="22" rx="4"/><text x="24" y="66">Navigation (nav)</text><rect class="s" x="12" y="78" width="296" height="104" rx="4"/><text x="24" y="98">Main content</text><rect class="g1" x="24" y="108" width="170" height="8" rx="3"/><rect class="g1" x="24" y="124" width="140" height="8" rx="3"/><rect class="g1" x="24" y="140" width="160" height="8" rx="3"/><rect class="b" x="212" y="104" width="86" height="64" rx="4"/><rect class="s" x="12" y="188" width="296" height="30" rx="4"/><text x="24" y="208">Footer</text><text class="m" x="212" y="208">© · contact · links</text>`);
const shop=fig('0 0 360 250',`<rect class="b" x="2" y="2" width="356" height="246" rx="8"/><rect class="g1" x="12" y="12" width="50" height="24" rx="4"/><rect class="b" x="74" y="12" width="150" height="24" rx="12"/>${ico('search',200,16,16)}<rect class="b" x="234" y="12" width="52" height="24" rx="4"/><text x="244" y="29" class="m">Login</text><rect class="b" x="294" y="12" width="52" height="24" rx="4"/>${ico('cart',308,15,18)}<rect class="s" x="12" y="44" width="334" height="20" rx="4"/><text x="22" y="58" class="m">Menu · Categories · Deals</text><rect class="b" x="12" y="72" width="334" height="62" rx="4"/>${ico('image',166,84,36)}${[0,1,2].map(i=>`<rect class="b" x="${12+i*113}" y="142" width="108" height="96" rx="4"/><rect class="g1" x="${20+i*113}" y="150" width="92" height="44" rx="3"/><rect class="g1" x="${20+i*113}" y="202" width="60" height="7" rx="3"/><rect class="s" x="${20+i*113}" y="216" width="40" height="14" rx="3"/>`).join('')}${mk(20,58,1)}${mk(190,40,2)}${mk(30,126,3)}${mk(330,200,4)}${mk(256,8,5)}${mk(338,8,6)}`);
const tri=fig('0 0 450 150',[['HTML','structure',0,0],['+ CSS','style',1,1],['+ JavaScript','behavior',2,2]].map(([a,b,k,l])=>{const x=k*150+5;return `<rect class="b" x="${x}" y="4" width="130" height="100" rx="6"/>`+(l?`<rect class="a" x="${x+8}" y="12" width="114" height="16" rx="3"/><rect class="s" x="${x+8}" y="34" width="50" height="40" rx="3"/>`:`<rect x="${x+8}" y="12" width="114" height="16" rx="3" fill="none" stroke="var(--mu)" stroke-dasharray="3 2"/><rect x="${x+8}" y="34" width="50" height="40" rx="3" fill="none" stroke="var(--mu)" stroke-dasharray="3 2"/>`)+`<rect class="g1" x="${x+66}" y="38" width="54" height="6" rx="3"/><rect class="g1" x="${x+66}" y="50" width="44" height="6" rx="3"/>`+(l==2?`<rect class="a" x="${x+66}" y="64" width="46" height="16" rx="8"/>${ico('cursor',x+100,70,18)}`:'')+`<text x="${x+65}" y="126" text-anchor="middle" style="font-weight:700">${a}</text><text class="m" x="${x+65}" y="142" text-anchor="middle">${b}</text>`}).join(''));
const jour=fig('0 0 560 190',`<rect class="s" x="10" y="30" width="140" height="100" rx="10"/>${ico('monitor',60,44,40)}<text x="80" y="112" text-anchor="middle" style="font-weight:700">Browser</text><rect class="s" x="410" y="30" width="140" height="100" rx="10"/>${ico('server',460,44,40)}<text x="480" y="112" text-anchor="middle" style="font-weight:700">Server</text><path class="l" d="M155 64H402" marker-end="url(#ah)"/><text x="278" y="55" text-anchor="middle">① Request: the URL</text><path class="l" d="M405 100H158" marker-end="url(#ah)"/><text x="278" y="124" text-anchor="middle">② Response: HTML, CSS, JS</text><text class="m" x="80" y="156" text-anchor="middle">③ Renders the page</text><text class="m" x="480" y="156" text-anchor="middle">Stores the files</text>`);
const range=fig('0 0 560 150',`<line x1="30" y1="70" x2="530" y2="70" stroke="var(--bd)" stroke-width="8" stroke-linecap="round"/><line x1="64" y1="70" x2="500" y2="70" stroke="var(--ac)" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/><circle cx="64" cy="70" r="7" class="a"/><circle cx="223" cy="70" r="11" class="a"/><circle cx="500" cy="70" r="7" class="a"/><text x="64" y="104" text-anchor="middle" style="font-weight:700">&lt; $49K</text><text class="m" x="64" y="120" text-anchor="middle">lowest 10%</text><text x="223" y="40" text-anchor="middle" style="font-weight:700">~$91K</text><text class="m" x="223" y="104" text-anchor="middle">median</text><text x="500" y="104" text-anchor="middle" style="font-weight:700">&gt; $163K</text><text class="m" x="500" y="120" text-anchor="middle">top 10%</text>`);
const insp=fig('0 0 380 230',`<rect class="b" x="2" y="2" width="376" height="226" rx="8"/><path d="M2 30h376" stroke="var(--bd)"/><circle cx="16" cy="16" r="4" class="g1"/><circle cx="30" cy="16" r="4" class="g1"/><circle cx="44" cy="16" r="4" class="g1"/><rect class="g1" x="64" y="9" width="180" height="14" rx="7"/><rect class="s" x="12" y="40" width="170" height="26" rx="3"/><rect class="g1" x="12" y="72" width="170" height="14" rx="3"/><rect class="b" x="12" y="92" width="170" height="90" rx="3"/><rect class="s" x="12" y="188" width="170" height="30" rx="3"/><path d="M192 30v198" stroke="var(--bd)"/><text class="m" x="202" y="50">Elements · Styles</text><text x="202" y="76" style="font-family:monospace;font-size:12px">&lt;body&gt;</text><text x="212" y="96" style="font-family:monospace;font-size:12px;font-weight:700">&lt;header&gt;</text><rect x="206" y="82" width="104" height="18" rx="3" fill="var(--ac)" fill-opacity=".18"/><text x="212" y="116" style="font-family:monospace;font-size:12px">&lt;nav&gt;</text><text x="212" y="136" style="font-family:monospace;font-size:12px">&lt;main&gt;</text><text x="212" y="156" style="font-family:monospace;font-size:12px">&lt;footer&gt;</text><text class="m" x="202" y="186" style="font-family:monospace">header { color: …; }</text>`);
const venn=fig('0 0 320 240',`<circle cx="120" cy="90" r="66" class="s" fill-opacity=".5"/><circle cx="200" cy="90" r="66" class="s" fill-opacity=".5"/><circle cx="160" cy="154" r="66" class="s" fill-opacity=".5"/><text x="92" y="82" text-anchor="middle" style="font-weight:700">Content</text><text x="228" y="82" text-anchor="middle" style="font-weight:700">Design</text><text x="160" y="190" text-anchor="middle" style="font-weight:700">Technology</text><text x="160" y="122" text-anchor="middle" class="m">Website</text>`);
const fb=fig('0 0 420 170',`<rect class="s" x="10" y="20" width="140" height="100" rx="10"/>${ico('monitor',60,34,40)}<text x="80" y="100" text-anchor="middle" style="font-weight:700">Front-end</text><text class="m" x="80" y="114" text-anchor="middle">in the browser</text><rect class="s" x="270" y="20" width="140" height="100" rx="10"/>${ico('server',320,34,40)}<text x="340" y="100" text-anchor="middle" style="font-weight:700">Back-end</text><text class="m" x="340" y="114" text-anchor="middle">on the server</text><path class="l" d="M155 55H262" marker-end="url(#ah)"/><path class="l" d="M265 85H158" marker-end="url(#ah)"/><text class="m" x="210" y="146" text-anchor="middle">requests and data</text>`);

const hero=fig('0 0 360 270',`<rect class="b" x="20" y="8" width="320" height="156" rx="10"/><path d="M20 36h320" stroke="var(--bd)"/><circle cx="38" cy="22" r="4" class="g1"/><circle cx="52" cy="22" r="4" class="g1"/><circle cx="66" cy="22" r="4" class="g1"/>${ico('code',140,52,80)}${[['HTML','structure'],['CSS','style'],['JS','behavior']].map(([a,b],k)=>`<rect class="s" x="${20+k*112}" y="184" width="96" height="70" rx="12"/><text x="${68+k*112}" y="216" text-anchor="middle" style="font-weight:800;font-size:22px">${a}</text><text class="m" x="${68+k*112}" y="238" text-anchor="middle">${b}</text>`).join('')}`);
const range2=fig('0 0 560 170',`<line x1="30" y1="80" x2="530" y2="80" stroke="var(--bd)" stroke-width="8" stroke-linecap="round"/><line x1="74" y1="80" x2="107" y2="80" stroke="var(--ac)" stroke-width="8" stroke-linecap="round"/><line x1="120" y1="80" x2="488" y2="80" stroke="var(--ac)" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#ah)"/><circle cx="74" cy="80" r="7" class="a"/><circle cx="89" cy="80" r="10" class="a"/><circle cx="107" cy="80" r="7" class="a"/><circle cx="504" cy="80" r="7" class="a"/><text x="89" y="52" text-anchor="middle" style="font-weight:700">~$940</text><text x="60" y="114" style="font-weight:700">Lebanon today</text><text class="m" x="60" y="130">~$700–$1,200 / month</text><text class="m" x="300" y="68" text-anchor="middle">Remote work for clients abroad can reach much higher</text><text x="530" y="114" text-anchor="end" style="font-weight:700">US median</text><text class="m" x="530" y="130" text-anchor="end">~$7.6K / month</text>`);
/* slides */
const cyc=fig('0 0 460 300',`<circle cx="230" cy="150" r="95" fill="none" stroke="var(--bd)" stroke-width="2" stroke-dasharray="5 5"/>`+['Empathize','Define','Ideate','Prototype','Test'].map((t,i)=>{const a=(-90+i*72)*Math.PI/180,x=230+95*Math.cos(a),y=150+95*Math.sin(a),lx=230+135*Math.cos(a),ly=150+135*Math.sin(a)+4;return `<circle cx="${x}" cy="${y}" r="24" class="a"/><text x="${x}" y="${y+6}" text-anchor="middle" class="mt" style="font-size:16px">${i+1}</text><text x="${lx}" y="${ly}" text-anchor="middle" style="font-weight:700">${t}</text>`}).join('')+`<text x="230" y="146" text-anchor="middle" style="font-weight:700">Design</text><text x="230" y="164" text-anchor="middle" style="font-weight:700">Thinking</text>`);
const persona=fig('0 0 320 230',`<rect class="b" x="2" y="2" width="316" height="226" rx="12"/><circle cx="52" cy="52" r="26" class="s"/>${ico('users',38,38,28)}<text x="92" y="48" style="font-weight:700;font-size:16px">Sara, 17</text><text class="m" x="92" y="66">High-school student · example persona</text>`+[['Needs','Find scholarships easily'],['Struggles','Information is scattered everywhere'],['Feels','Stressed and unsure where to start']].map(([a,b],i)=>`<text x="20" y="${112+i*38}" style="font-weight:700">${a}</text><text class="m" x="20" y="${128+i*38}">${b}</text>`).join(''));
const sticky=fig('0 0 360 230',[[20,20,-4,'s','A map of local shops'],[130,14,3,'s','Student tips forum'],[240,26,-2,'s','Scholarship finder'],[28,120,3,'b','Volunteer sign-up'],[140,118,-3,'s','Artist gallery'],[250,124,4,'b','Wild idea: AI tutor!']].map(([x,y,r,c,t])=>`<g transform="rotate(${r} ${x+50} ${y+40})"><rect class="${c}" x="${x}" y="${y}" width="100" height="84" rx="4"/><text x="${x+8}" y="${y+34}" style="font-size:12px">${t.split(' ').slice(0,2).join(' ')}</text><text x="${x+8}" y="${y+52}" style="font-size:12px">${t.split(' ').slice(2).join(' ')}</text></g>`).join(''));
const smap=fig('0 0 360 200',`<path d="M180 62V84M60 84H300M60 84V108M180 84V108M300 84V108" stroke="var(--ac)" stroke-width="2" fill="none"/><rect class="s" x="130" y="22" width="100" height="40" rx="8"/><text x="180" y="47" text-anchor="middle" style="font-weight:700">Home</text>`+['About','Services','Contact'].map((t,i)=>`<rect class="s" x="${10+i*120}" y="108" width="100" height="40" rx="8"/><text x="${60+i*120}" y="133" text-anchor="middle" style="font-weight:700">${t}</text>`).join('')+`<text class="m" x="180" y="182" text-anchor="middle">Site map: the key pages of your site</text>`);
const loop=fig('0 0 420 150',[['Share',20],['Feedback',160],['Improve',300]].map(([t,x],i)=>`<rect class="s" x="${x}" y="30" width="100" height="44" rx="8"/><text x="${x+50}" y="57" text-anchor="middle" style="font-weight:700">${t}</text>`+(i<2?`<path class="l" d="M${x+104} 52H${x+154}" marker-end="url(#ah)"/>`:'')).join('')+`<path class="l" d="M350 80V118H70V82" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="m" x="210" y="140" text-anchor="middle">repeat until it works for users</text>`);
const act=(t,x)=>`<div class="lv"><b>${t}</b> ${x}</div>`;
const stack=a=>`<div class="g" style="grid-template-columns:1fr">${a.map(([i,h,p])=>`<div class="c" style="display:flex;gap:1vw;align-items:center">${ib(i)}<div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}</div>`;

s(row(`<div class="tag">Day 2 · Session 2</div><h1>Design Thinking<br>for the Web</h1><h3>Turn Ideas Into Real-World Web Solutions</h3><p>Fridays &amp; Sundays, 12:00–2:00 · Think first, code later</p>`,cyc),
'Welcome back. Quick recap of Day 1 (browser/server, HTML-CSS-JS). Today there is no code: we learn to plan a website around real people before we build it. Total time about 2 hours.');

s(T('Definition','What is Design Thinking?')+`<div class="c cur"><h3 style="font-size:clamp(20px,2.6vw,34px);line-height:1.3">Design Thinking is a human-centered way to solve problems: understand people first, then create and test solutions with them in mind.</h3></div>`+cards([['Human-centered','Start with real people and their needs, not with technology.','users'],['Creative','Brainstorm many ideas before you choose one.','zap'],['Repeating','Test, learn, and improve until it works.','trend']])+`<div class="lv"><b>For websites:</b> instead of asking “What website can I build?”, ask “Who needs help, and what would help them?”</div>`,
'About 5 min. Read the definition aloud, then ask: "Who has used a website or app that was confusing? Why?" Explain that it was probably built without asking the users. Design Thinking prevents that.');

s(T('Session objectives','By the end of this session, you will…')+cards([['Identify &amp; solve','Explore real-world problems and brainstorm website ideas that offer effective solutions.','search'],['Design with purpose','Apply Design Thinking to build with empathy and user-centered goals.','compass']])+`<p>Recap: what are the three front-end languages, and what does each do?</p>`,
'2 min recap question: HTML structure, CSS style, JavaScript behavior. Then objectives (3 min). Say: good developers plan first, because a nice site that solves no problem helps nobody.');

s(T('The 5 steps of Design Thinking','A creative method to solve real problems')+row(cyc,stack([['users','1 Empathize','Understand user needs through observation and research.'],['pen','2 Define','State the core problem clearly, based on user insights.'],['zap','3 Ideate','Brainstorm many innovative solutions.'],['layout','4 Prototype','Create a tangible draft to test.'],['check','5 Test','Gather feedback and improve.']])),
'About 8 min. Walk around the circle clockwise. Stress that it is a loop: Test often sends you back to an earlier step. Example: a restaurant app that nobody uses is a design-thinking failure, not a coding failure.');

s(T('Real-world challenges you might solve','Ideas to inspire your group')+cards([['Mental health support','Accessible networks for awareness and peer support.','users'],['Jobs &amp; internships for youth','Helping young people find training, internships, and first jobs.','briefcase'],['Recycling &amp; clean neighborhoods','Organizing clean-up days and teaching how to sort waste.','globe'],['Volunteer matching','Connecting volunteers with people and groups who need help.','tool'],['Peer tutoring','Students helping students with school subjects.','book']])+`<p>Tip: look around Sidon and your own life. The best problems are close to you.</p>`,
'About 5 min. These are only examples. Ask: "What problem have you or your family faced in the last month that a website could help with?" The next slide walks through Mental health support as a full example.');

s(T('Worked example: Mental health support','The 5 steps applied to one problem')+`<div class="g" style="grid-template-columns:repeat(5,1fr)">${[['users','1 Empathize','Interview 3 classmates: “Who do you talk to when you feel stressed?” Many feel alone and don’t know where to start.'],['pen','2 Define','How might we help teens find calm, trusted support without feeling judged?'],['zap','3 Ideate','Peer-story wall, breathing exercises, list of trusted counselors, a “Get help” button, volunteer chat (wild idea).'],['layout','4 Prototype','Pages: Home, Tips, Stories, Get help. Header, nav, calm content cards, footer with help links.'],['check','5 Test','Another team asks: “Can I find help in 10 seconds?” Fix: a big “Get help” button on every page.']].map(([i,h,p])=>`<div class="c">${ib(i)}<h3>${h}</h3><p style="font-size:clamp(11px,1.2vw,16px)">${p}</p></div>`).join('')}</div>`+act('Note:','the website connects people to trusted help. It does not replace a professional.'),
'About 8 min. Walk left to right and show how each step uses the result of the one before. Handle the topic gently: the site points to trusted professionals and never gives medical advice. Tell groups they will do the same 5 steps for their own problem.');

s(T('Pick a problem you care about','In your groups, choose ONE real problem')+cards([['What issue does it address?','A clear problem or need in your community or daily life.','search'],['Who is the target audience?','Who exactly would benefit most from the solution?','users'],['How could a website help?','Specific features and functions it would offer.','laptop']])+act('Activity · groups of 3–4 · 10 min:','write the problem, the audience, and one website idea on one sheet of paper.')+lv('choose a problem close to daily life.','think about who would pay for or maintain this website.'),
'10 min activity. Mix levels in each group. Walk around and check each group has ONE problem (not three). Tell groups to keep their sheet: it is used in every step today.');

s(T('Step 1: Empathize','Understand the people you design for')+row(persona,stack([['users','Who are your target users?','Identify who will benefit from your site.'],['search','What do they struggle with?','Their pain points, challenges, frustrations.'],['compass','Needs, emotions, behaviors','How they feel and how they solve it today.']]))+act('Activity · 10 min:','interview a teammate about the problem, or draw a persona card like Sara’s (name, age, needs, struggles, feelings).'),
'About 15 min with the activity. The persona on the slide is an example. Teach: ask open questions like "Tell me about the last time you…" and listen. Do not suggest solutions yet.');

s(T('Step 2: Define the problem','Write one clear “How might we…?” question')+`<div class="fl"><div class="c"><h3>How might we</h3><p>always start with this</p></div>${ic('arrow')}<div class="c"><h3>help [who]</h3><p>your target users</p></div>${ic('arrow')}<div class="c"><h3>do [what]?</h3><p>the goal you want to reach</p></div></div><div class="g"><div class="c cur"><h3>How might we help youth find local scholarships?</h3><p>Focuses on giving students easy access to financial-aid information.</p></div><div class="c cur"><h3>How might we promote healthy habits through peer tips?</h3><p>A supportive community where young people share wellness advice.</p></div></div>`+act('Task · 5 min:','write your group’s “How might we…?” question on the sheet.'),
'About 10 min. A good statement is specific, about people, and not a solution in disguise. Bad: "How might we build an app?" Good: "How might we help shop owners in Sidon reach more customers?"');

s(T('Step 3: Ideate','Brainstorm as many ideas as possible')+row(sticky,stack([['zap','Think big and wild','Explore unconventional, imaginative solutions.'],['check','No wrong answers','Even the craziest ideas can be a starting point.'],['pen','Sketch layouts','Draw several layout ideas on paper or a whiteboard.']]))+act('Activity · 10 min:','each person writes 3 ideas on sticky notes, then the group picks the best one together.'),
'About 15 min. Rules: quantity over quality, nobody criticizes during brainstorming. Then vote with dots or by raising hands for the idea to prototype.');

s(T('Step 4: Prototype','Sketch your web layout')+row(smap,anat)+`<div class="g"><div class="c"><h3>Outline key pages</h3><p>Homepage, about, contact…</p></div><div class="c"><h3>Map layout blocks</h3><p>Header, navigation, content blocks, footer.</p></div><div class="c"><h3>Tools</h3><p>Paper, Canva, Figma, or an AI assistant.</p></div></div>`+act('Activity · 15 min:','draw your site map and a sketch of your homepage using the four blocks from Day 1.')+lv('paper is perfect.','try Figma, Canva, or an AI draft (next slide).'),
'About 20 min. Connect to Day 1: the header, nav, main, footer. Remind them this sketch will be turned into HTML in Session 3, so label the blocks clearly.');

s(T('Prototype with AI (optional)','Ask any AI assistant to draft your layout')+row(`<div class="c cur"><h3>Copy this prompt and fill the [brackets]</h3><pre style="white-space:pre-wrap;max-height:none">I am designing a website for [my target users, e.g. teenagers in Lebanon] to solve this problem: [my “How might we…?” question].

Suggest a site map with the key pages. Then, for the homepage, list the layout blocks in order (header, navigation, main content sections, footer) and say what goes in each block.

Keep it simple and mobile-friendly. Show the result as a simple text wireframe. Do not write code.</pre></div>`,stack([['users','Give context','Say who the users are and what problem you defined in steps 1 and 2.'],['check','Check the draft','Does it match what you learned from your users? Remove what doesn’t fit.'],['pen','Improve and redraw','Ask follow-ups, like “make the Get help button more visible”, then redraw it on paper, Canva, or Figma.']]))+lv('copy the prompt as it is.','add your own needs, such as a color style or a feature list.'),
'About 5 min, optional. Key message: AI gives a first draft and the team decides. The draft must match the users they interviewed. Ask students to compare the AI layout with their own sketch and say which they prefer, and why.');

s(T('Step 5: Test &amp; improve','Get feedback from another team')+row(loop,`<div class="g" style="grid-template-columns:1fr 1fr">${[['users','Share your prototype','Present your layout to another team.'],['search','Ask specific questions','What’s clear? What’s confusing? First impressions?'],['pen','Suggest improvements','Give at least two concrete ideas.'],['file','Record feedback','Write down every comment for your project.']].map(([i,h,p])=>`<div class="c">${ib(i)}<h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`)+act('Activity · 12 min:','swap with another team, 5 min each way, then note two improvements.'),
'About 15 min. Rule for feedback: say one thing you like, then one thing to improve. The owner only listens and writes, no defending.');

s(T('Group share','Each group presents briefly')+cards([['The problem','The core challenge your group found.','search'],['Target users','Who will benefit most from your solution.','users'],['Solution &amp; layout','Your website idea and first design sketch.','layout']])+act('Format:','2 minutes per group. Hold up your sketch. Others clap and name one thing they liked.'),
'About 15 min. Keep time strictly. Take photos of the sketches (with permission) so students can use them in Session 3.');

s(T('Wrap-up &amp; what’s next','You imagined a site with purpose')+cards([['Empathized &amp; defined','You applied Design Thinking to a real-world problem, with users at the center.','users'],['Ideated, prototyped, tested','You went from an idea to a sketch and improved it with feedback.','layout'],['Next: Session 3 · HTML5','Turn your design into code: structure, elements, forms, and your own web profile.','code']])+`<p><b style="color:var(--tx)">Before next time:</b> keep your sketch, and check that VS Code and Live Server work on your laptop.</p>`,
'2 min. Celebrate the groups. Preview next session: they will build a web profile with HTML in VS Code, so the sketch and the VS Code setup are the homework.');

const D=document.getElementById('deck');let i=0;
S.forEach(x=>{const e=document.createElement('section');e.className='sl';e.innerHTML=x.b;D.appendChild(e)});
const el=[...D.children];
function go(n){i=Math.max(0,Math.min(S.length-1,n));el.forEach((e,k)=>e.classList.toggle('on',k===i));
document.getElementById('pf').style.width=((i+1)/S.length*100)+'%';document.getElementById('ct').textContent=(i+1)+' / '+S.length;
document.getElementById('ntx').textContent=S[i].n||'No notes for this slide.'}
const nx=()=>go(i+1),pv=()=>go(i-1);
document.getElementById('nx').onclick=nx;document.getElementById('pv').onclick=pv;
const tn=()=>document.getElementById('nt').classList.toggle('on');
const tf=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.getElementById('nb').onclick=tn;document.getElementById('fs').onclick=tf;
document.querySelectorAll('.q').forEach(q=>q.onclick=()=>q.classList.toggle('open'));
addEventListener('keydown',e=>{const k=e.key;
if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();nx()}
else if(k==='ArrowLeft'||k==='PageUp')pv();
else if(k==='Home')go(0);else if(k==='End')go(S.length-1);
else if(k==='n'||k==='N')tn();else if(k==='f'||k==='F')tf()});
go(0);
</script>
</body>
</html>
